<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inventory Player (Không mở rương)</title>
    <style>
        body {
          background-color: #1e1e1e;
          color: white;
          font-family: sans-serif;
          text-align: center;
          padding: 20px;
        }

        h2 {
          margin-bottom: 10px;
        }

        .grid {
          display: grid;
          grid-template-columns: repeat(9, 40px);
          gap: 4px;
          justify-content: center;
          margin-bottom: 20px;
        }

        .slot {
          width: 40px;
          height: 40px;
          background-color: #333;
          border: 2px solid #777;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 12px;
          border-radius: 4px;
        }

        .hotbar .slot {
          background-color: #666;
        }
    </style>
</head>
<body>
<h2>🎒 Inventory Player (Không mở rương)</h2>

<div class="grid" id="mainInventory"></div>
<div class="grid hotbar" id="hotbar"></div>

<script>
    const mainInventory = document.getElementById('mainInventory');
    const hotbar = document.getElementById('hotbar');

    // Inventory chính: slot 9 → 35
    for (let i = 9; i < 36; i++) {
      const slot = document.createElement('div');
      slot.className = 'slot';
      slot.textContent = i;
      mainInventory.appendChild(slot);
    }

    // Hotbar: slot 0 → 8
    for (let i = 0; i < 9; i++) {
      const slot = document.createElement('div');
      slot.className = 'slot';
      slot.textContent = i;
      hotbar.appendChild(slot);
    }
</script>
</body>
</html>
