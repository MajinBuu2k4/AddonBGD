<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mở Shulker / Chest / Ender Chest</title>
    <style>
        body {
          background-color: #1f1f1f;
          color: white;
          font-family: sans-serif;
          text-align: center;
          padding: 20px;
        }

        h2 {
          margin: 10px;
        }

        .grid {
          display: grid;
          grid-template-columns: repeat(9, 40px);
          gap: 4px;
          justify-content: center;
          margin-bottom: 20px;
        }

        .slot {
          width: 40px;
          height: 40px;
          background-color: #444;
          border: 2px solid #888;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 12px;
          border-radius: 4px;
        }

        .container .slot {
          background-color: #552e7a; /* tím tím giống shulker box */
        }

        .inventory .slot {
          background-color: #333;
        }

        .hotbar .slot {
          background-color: #666;
        }
    </style>
</head>
<body>
<h2>📦 Shulker / Ender / Chest (3x9)</h2>
<div class="grid container" id="containerGrid"></div>

<h2>🎒 Inventory Player (3x9)</h2>
<div class="grid inventory" id="inventoryGrid"></div>

<h2>🔧 Hotbar (1x9)</h2>
<div class="grid hotbar" id="hotbarGrid"></div>

<script>
    // Container: slot 0 – 26
    const containerGrid = document.getElementById('containerGrid');
    for (let i = 0; i < 27; i++) {
      const slot = document.createElement('div');
      slot.className = 'slot';
      slot.textContent = i;
      containerGrid.appendChild(slot);
    }

    // Player inventory: slot 27 – 53
    const inventoryGrid = document.getElementById('inventoryGrid');
    for (let i = 27; i < 54; i++) {
      const slot = document.createElement('div');
      slot.className = 'slot';
      slot.textContent = i;
      inventoryGrid.appendChild(slot);
    }

    // Hotbar: slot 54 – 62
    const hotbarGrid = document.getElementById('hotbarGrid');
    for (let i = 54; i < 63; i++) {
      const slot = document.createElement('div');
      slot.className = 'slot';
      slot.textContent = i;
      hotbarGrid.appendChild(slot);
    }
</script>
</body>
</html>
